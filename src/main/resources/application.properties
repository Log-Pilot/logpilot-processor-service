spring.application.name=processor-service
server.port=${SERVER_PORT:8082}
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/logpilot}
spring.datasource.username=${DATABASE_USERNAME:logpilot}
spring.datasource.password=${DATABASE_PASSWORD:logpilot-local-only}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,redis

logpilot.processor.stream=${LOG_STREAM:logpilot:logs}
logpilot.processor.dead-letter-stream=${LOG_DLQ_STREAM:logpilot:logs:dlq}
logpilot.processor.consumer-group=${LOG_CONSUMER_GROUP:logpilot-processors}
logpilot.processor.consumer-name=${LOG_CONSUMER_NAME:processor-1}
logpilot.processor.batch-size=${LOG_BATCH_SIZE:100}
logpilot.processor.poll-delay-ms=${LOG_POLL_DELAY_MS:1000}
